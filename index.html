<!DOCTYPE html>
<html>
<head>
    <title>Burnout & Fatigue Detection</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
            width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        label {
            font-size: 14px;
            color: #555;
            display: block;
            text-align: left;
            margin-left: 5%;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #007bff;
        }

        /* Camera */

        #camera {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            display: none;
        }

        #canvas {
            display: none;
        }

        #capture {
            display: none;
        }

        #cameraStatus {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Burnout & Fatigue Detection</h1>

    <form action="/analyze_all" method="POST">

        <!-- EMAIL -->

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <!-- WORKING HOURS -->

        <label>Working Hours</label>

        <input
            type="number"
            name="work"
            min="0"
            max="24"
            required
        >


        <!-- SLEEP HOURS -->

        <label>Sleep Hours</label>

        <input
            type="number"
            name="sleep"
            min="0"
            max="24"
            required
        >


        <!-- START CAMERA -->

        <button
            type="button"
            id="startCamera"
        >
            Start Camera
        </button>


        <!-- CAMERA PREVIEW -->

        <video
            id="camera"
            autoplay
            playsinline
        ></video>


        <!-- HIDDEN CANVAS -->

        <canvas id="canvas"></canvas>


        <!-- CAPTURE BUTTON -->

        <button
            type="button"
            id="capture"
        >
            Capture
        </button>


        <!-- ANALYZE -->

        <button
            type="submit"
        >
            Analyze + Face Scan
        </button>

        <p id="cameraStatus">
            Camera not started
        </p>

    </form>

</div>


<script>

    // Get HTML elements

    const startCameraButton =
        document.getElementById("startCamera");

    const captureButton =
        document.getElementById("capture");

    const video =
        document.getElementById("camera");

    const canvas =
        document.getElementById("canvas");

    const cameraStatus =
        document.getElementById("cameraStatus");


    // Store camera stream

    let cameraStream = null;


    // START CAMERA

    startCameraButton.addEventListener("click", async function() {

        try {

            cameraStream =
                await navigator.mediaDevices.getUserMedia({
                    video: true
                });

            video.srcObject = cameraStream;

            video.style.display = "block";

            captureButton.style.display = "block";

            cameraStatus.innerText =
                "Camera started. Position your face and click Capture.";

        }

        catch (error) {

            console.error(error);

            cameraStatus.innerText =
                "Camera permission denied or camera unavailable.";

        }

    });


    // CAPTURE IMAGE

    captureButton.addEventListener("click", function() {

        if (!cameraStream) {

            cameraStatus.innerText =
                "Please start the camera first.";

            return;

        }


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const context =
            canvas.getContext("2d");


        context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        cameraStatus.innerText =
            "Face captured successfully.";

    });

</script>

</body>
</html>
